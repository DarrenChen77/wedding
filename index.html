    </header>
    <div class="clock" id="dClock">
      <div class="cd"><span class="cd__n" id="cdD">—</span><span class="cd__u">DAYS</span></div>
      <div class="cd"><span class="cd__n" id="cdH">—</span><span class="cd__u">HRS</span></div>
      <div class="cd"><span class="cd__n" id="cdM">—</span><span class="cd__u">MIN</span></div>
      <div class="cd"><span class="cd__n" id="cdS">—</span><span class="cd__u">SEC</span></div>
    </div>
    <p class="count__date" id="dDateEn"></p>
    <p class="quote" id="dQuote"></p>
  </div>
</section>

<!-- ═══ 婚禮資訊 ═══ -->
<section class="sec sec--tint reveal">
  <div class="wrap">
    <header class="sec__head">
      <h2 class="sec__en">Wedding Details</h2>
      <p class="sec__zh">婚禮資訊</p>
    </header>
    <div id="dCards"></div>
  </div>
</section>

<!-- ═══ 服裝建議 ═══ -->
<section class="sec reveal" id="secDress" hidden>
  <div class="wrap">
    <header class="sec__head">
      <h2 class="sec__en">Dress Code</h2>
      <p class="sec__zh">服裝色彩建議</p>
    </header>
    <div class="swatches" id="dSwatches"></div>
    <p class="dress__note">邀請你穿著以上色系，與我們一起入鏡</p>
  </div>
</section>

<!-- ═══ 相簿 ═══ -->
<section class="wrap gallery reveal" id="dGallery" hidden></section>

<!-- ═══ 回函 ═══ -->
<section class="sec sec--tint reveal" id="rsvp">
  <div class="wrap">
    <header class="sec__head">
      <h2 class="sec__en">Awaiting Your Reply</h2>
      <p class="sec__zh">出席回函</p>
    </header>

    <div id="formBox">
      <p class="rsvp__sub">為了幫你留好位子，請在 <b id="dDeadline"></b> 前告訴我們。</p>

      <form id="rsvpForm" novalidate>
        <div class="f">
          <label for="fName">姓名<span class="en">NAME</span><span class="req">*</span></label>
          <input type="text" id="fName" autocomplete="name" placeholder="請輸入姓名">
        </div>

        <div class="f">
          <label for="fContact">手機號碼<span class="en">MOBILE</span></label>
          <input type="tel" id="fContact" autocomplete="tel" inputmode="tel" placeholder="09xx-xxx-xxx">
        </div>

        <div class="f">
          <label for="fRelation">與新人的關係<span class="en">RELATIONSHIP</span></label>
          <select id="fRelation"><option value="">請選擇</option></select>
        </div>

        <div class="f">
          <span class="lg">是否出席<span class="en">ATTENDANCE</span><span class="req">*</span></span>
          <div class="pick">
            <input type="radio" name="attend" id="aYes" value="yes">
            <label for="aYes">是，我會出席</label>
            <input type="radio" name="attend" id="aNo" value="no">
            <label for="aNo">抱歉無法出席<br>獻上祝福</label>
          </div>
        </div>

        <div id="details">
          <div class="f">
            <label for="fAdults">大人人數<span class="en">ADULTS</span><span class="req">*</span></label>
            <select id="fAdults">
              <option value="">請選擇</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>

          <div class="grid2">
            <div class="f">
              <label for="fKidsA">兒童 <span class="hint">需座位</span></label>
              <select id="fKidsA">
                <option value="">—</option>
                <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
              </select>
            </div>
            <div class="f">
              <label for="fKidsB">兒童 <span class="hint">不佔位</span></label>
              <select id="fKidsB">
                <option value="">—</option>
                <option>0</option><option>1</option><option>2</option>
              </select>
            </div>
          </div>

          <div class="f">
            <span class="lg">飲食需求<span class="en">DIETARY</span><span class="hint"> 可複選</span></span>
            <div class="chips" id="dietChips">
              <input type="checkbox" id="d1" value="葷食"><label for="d1">葷食</label>
              <input type="checkbox" id="d2" value="全素"><label for="d2">全素</label>
              <input type="checkbox" id="d3" value="蛋奶素"><label for="d3">蛋奶素</label>
              <input type="checkbox" id="d4" value="不吃牛"><label for="d4">不吃牛</label>
              <input type="checkbox" id="d5" value="其他過敏原"><label for="d5">其他過敏原</label>
              <input type="checkbox" id="d6" value="其他"><label for="d6">其他</label>
            </div>
            <div id="allergyBox" hidden style="margin-top:1rem">
              <input type="text" id="fAllergy" placeholder="請說明過敏原或特殊需求">
            </div>
          </div>
        </div>

        <div class="f">
          <label for="fMsg">給新人的祝福<span class="en">BLESSING</span></label>
          <textarea id="fMsg" rows="3" placeholder="留下你的悄悄話⋯"></textarea>
        </div>

        <p class="err" id="errBox" role="alert" aria-live="polite"></p>
        <button type="submit" class="send" id="sendBtn">確認送出　SUBMIT</button>
      </form>
    </div>

    <div class="done" id="doneBox">
      <p class="done__mark">✦</p>
      <h3 class="done__t" id="doneT"></h3>
      <p class="done__s" id="doneS"></p>
    </div>
  </div>
</section>

<!-- ═══ 結尾 ═══ -->
<footer class="foot">
  <p class="foot__names" id="dFootNames"></p>
  <p class="foot__d">2026 . 11 . 07　TAIPEI</p>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   ③ 邏輯 — 以下不用改
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 封面 ─────────────────────────────────────────── */
$('dGroom').textContent     = CONFIG.groom;
$('dBride').textContent     = CONFIG.bride;
$('dTagEn').textContent     = CONFIG.taglineEn || '';
$('dTagZh').textContent     = CONFIG.taglineZh || '';
$('dDateEn').textContent    = CONFIG.dateEn;
$('dQuote').textContent     = CONFIG.quote || '';
$('dDeadline').textContent  = CONFIG.rsvpDeadline;
$('dFootNames').textContent = `${CONFIG.groom} & ${CONFIG.bride}`;
if (!CONFIG.quote) $('dQuote').hidden = true;

if (CONFIG.heroPhoto) {
  const bg = $('heroBg');
  bg.style.backgroundImage    = `url("${CONFIG.heroPhoto}")`;
  bg.style.backgroundPosition = CONFIG.heroFocus || 'center';
  bg.style.backgroundRepeat   = 'no-repeat';
  $('hero').classList.add('has-photo', CONFIG.heroText === 'dark' ? 'hero--light' : 'hero--dark');
  const og = document.createElement('meta');
  og.setAttribute('property','og:image'); og.content = CONFIG.heroPhoto;
  document.head.appendChild(og);
} else {
  $('hero').classList.add('hero--dark');
}

/* ── 資訊卡（?ceremony=1 才顯示證婚）───────────────── */
const CEREMONY_GUEST = new URLSearchParams(location.search).get('ceremony') === '1';
const cards = [];
if (CEREMONY_GUEST && CONFIG.ceremony) cards.push(CONFIG.ceremony);
if (CONFIG.banquet) cards.push(CONFIG.banquet);

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
          + '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

$('dCards').innerHTML = cards.map(c => `
  <article class="card">
    <h3 class="card__zh">【 ${esc(c.zh)} 】</h3>
    <p class="card__en">${esc(c.en)}</p>
    <p class="card__hero">${esc(c.hero)}</p>
    <div class="card__rule"></div>
    <p class="card__line"><b>地點</b>${esc(c.place)}</p>
    ${c.hall ? `<p class="card__line"><b>廳別</b>${esc(c.hall)}</p>` : ''}
    <p class="card__line"><b>時間</b>${esc(c.time)}</p>
    <p class="card__line"><b>地址</b>${esc(c.addr)}</p>
    ${CONFIG.mapUrl ? `<a class="mapbtn" href="${esc(CONFIG.mapUrl)}" target="_blank" rel="noopener">${PIN}交通指引　TRANSPORTATION</a>` : ''}
    ${c.notes && c.notes.length ? `<div class="card__notes">
      ${c.notes.map(n => `<p><b>${esc(n.k)}</b>${esc(n.v)}</p>`).join('')}
    </div>` : ''}
  </article>`).join('');

/* ── 服裝建議 ─────────────────────────────────────── */
if (CONFIG.dressCode && CONFIG.dressCode.length) {
  $('secDress').hidden = false;
  $('dSwatches').innerHTML = CONFIG.dressCode.map(c => `
    <div class="sw">
      <div class="sw__dot" style="background:${esc(c.hex)}"></div>
      <p class="sw__zh">${esc(c.zh)}</p>
      <p class="sw__en">${esc(c.en)}</p>
    </div>`).join('');
}

/* ── 相簿 ─────────────────────────────────────────── */
if (CONFIG.gallery && CONFIG.gallery.length) {
  $('dGallery').hidden = false;
  $('dGallery').innerHTML = CONFIG.gallery.map((src,i) =>
    `<img src="${esc(src)}" alt="${esc(CONFIG.groom)} & ${esc(CONFIG.bride)} 合照 ${i+1}" loading="lazy">`).join('');
}

/* ── 關係下拉 ─────────────────────────────────────── */
$('fRelation').insertAdjacentHTML('beforeend',
  RELATIONS.map(r => `<option>${esc(r)}</option>`).join(''));

/* ── 倒數 ─────────────────────────────────────────── */
(function countdown(){
  const target = new Date(CONFIG.dateISO);
  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const diff = target - new Date();
    if (diff <= 0) {
      $('dClock').innerHTML = '<p class="clock__done">今天就是我們的日子</p>';
      return true;
    }
    const s = Math.floor(diff/1000);
    $('cdD').textContent = Math.floor(s/86400);
    $('cdH').textContent = pad(Math.floor(s%86400/3600));
    $('cdM').textContent = pad(Math.floor(s%3600/60));
    $('cdS').textContent = pad(s%60);
  };
  if (!tick()) { const t = setInterval(() => { if (tick()) clearInterval(t); }, 1000); }
})();

/* ── 出席分流 ─────────────────────────────────────── */
document.querySelectorAll('input[name=attend]').forEach(r =>
  r.addEventListener('change', () => {
    $('details').classList.toggle('open', $('aYes').checked);
    $('errBox').textContent = '';
  }));

/* ── 過敏原自由輸入 ───────────────────────────────── */
const ALLERGY_TRIGGERS = ['d5','d6'];
if (CONFIG.allergyOtherEnabled) {
  ALLERGY_TRIGGERS.forEach(id => $(id).addEventListener('change', () => {
    $('allergyBox').hidden = !ALLERGY_TRIGGERS.some(t => $(t).checked);
  }));
}

/* ── 捲動進場 ─────────────────────────────────────── */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold:.1 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

/* ── 送出 ─────────────────────────────────────────── */
$('rsvpForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('errBox');
  const name = $('fName').value.trim();
  const yes = $('aYes').checked, no = $('aNo').checked;

  if (!name)       { err.textContent = '請留下你的名字。'; $('fName').focus(); return; }
  if (!yes && !no) { err.textContent = '請選擇是否出席。'; return; }
  if (yes && !$('fAdults').value) { err.textContent = '請選擇大人人數。'; $('fAdults').focus(); return; }
  err.textContent = '';

  const p = new URLSearchParams();
  p.append(FIELD.name,      name);
  p.append(FIELD.contact,   $('fContact').value.trim());
  p.append(FIELD.relation,  $('fRelation').value);
  p.append(FIELD.attending, yes ? ATTEND_YES : ATTEND_NO);
  p.append(FIELD.message,   $('fMsg').value.trim());

  if (yes) {
    p.append(FIELD.adults, $('fAdults').value);
    if ($('fKidsA').value) p.append(FIELD.kidsSeated, $('fKidsA').value);
    if ($('fKidsB').value) p.append(FIELD.kidsLap,    $('fKidsB').value);

    const picked = [...document.querySelectorAll('#dietChips input:checked')].map(c => c.value);
    if (CONFIG.allergyOtherEnabled) {
      const note = $('fAllergy').value.trim();
      picked.forEach(v => p.append(FIELD.diet, (v === '其他' && note) ? '__other_option__' : v));
      if (note) p.append(FIELD.diet + '.other_option_response', note);
    } else {
      picked.forEach(v => p.append(FIELD.diet, v));
    }
  }

  /* 多區段表單必要參數，少了 Google 只會收到第一頁 */
  p.append('fvv', '1');
  p.append('pageHistory', '0,1,2');
  p.append('submit', 'Submit');

  const btn = $('sendBtn');
  btn.disabled = true; btn.textContent = '送出中⋯';

  try {
    await fetch(CONFIG.formAction, {
      method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
      body:p.toString(),
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = '確認送出　SUBMIT';
    err.textContent = '送出失敗，請檢查網路後再試一次。';
    return;
  }

  $('formBox').hidden = true;
  $('doneT').textContent = yes ? '收到了' : '謝謝你的祝福';
  $('doneS').textContent = yes
    ? '十一月七日，我們留了位子等你。'
    : '很可惜這次見不到，你的心意我們收下了。';
  $('doneBox').classList.add('show');
  $('doneBox').scrollIntoView({ behavior:'smooth', block:'center' });
});
</script>
</body>
</html>
