<style>
/* ═══════════════════════════════════════════════════════════════
   ② 設計語彙 — 宣紙、墨、胭脂
   ═══════════════════════════════════════════════════════════════ */
:root{
  --paper:      #f7eeed;   /* 主色：Snow */
  --paper-2:    #eee1df;   /* 間隔色：同色相加深一階 */
  --card:       #fdf8f7;   /* 卡片：比主色再亮一階才浮得起來 */
  --wash:       #ded4c4;
  --ink:        #4a443d;   /* 深灰，不用純黑 */
  --ink-soft:   #635c53;
  --ink-faint:  #6a6259;
  --ink-ghost:  #a49a8d;
  --rouge:      #9c4f4a;
  --sage-deep:  #5f7a6f;

  /* 中文一律黑體：Windows 用微軟正黑、Apple 用蘋方、其餘落到已載入的 Noto Sans TC */
  --serif-tc: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  --serif-en: 'Cormorant Garamond', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  --sans-tc:  'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;

  --col: 34rem;
  --gut: 1.75rem;
}

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif-tc); font-weight:300;
  line-height:1.9; letter-spacing:.04em;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
:focus-visible{ outline:2px solid var(--rouge); outline-offset:3px; }
.wrap{ width:100%; max-width:var(--col); margin-inline:auto; padding-inline:var(--gut); }

/* ── 區塊標題：英文大標 ＋ 中文副標 ──────────────────── */
.sec{ padding:3.4rem 0; }
.sec--tint{ background:var(--paper-2); }
.sec__head{ text-align:center; margin-bottom:2.2rem; display:flex; flex-direction:column; }
/* 中文是主角、英文是配角：用 flex order 把 HTML 順序反過來顯示 */
.sec__zh{
  order:1;
  font-family:var(--serif-tc); font-weight:500;
  font-size:clamp(1.55rem,6.6vw,2rem); letter-spacing:.28em;
  color:var(--ink); margin:0; padding-left:.28em;
}
.sec__en{
  order:2;
  font-family:var(--serif-en); font-style:italic; font-weight:400;
  font-size:1.2rem; letter-spacing:.14em;
  color:var(--rouge); margin:.55rem 0 0;
}

/* ── 封面 ──────────────────────────────────────────── */
.hero{
  position:relative; min-height:100svh;
  display:flex; align-items:flex-end; justify-content:center;
  padding:10svh var(--gut) 7svh; overflow:hidden; background:var(--paper);
}
.hero__bg{
  position:absolute; inset:0; z-index:0; background-size:cover;
  background-image:linear-gradient(165deg,#3b342d 0%,#241f1b 55%,#171310 100%);
}
.hero.has-photo .hero__bg{ animation:drift 30s ease-in-out infinite alternate; }
@keyframes drift{ from{ transform:scale(1.04);} to{ transform:scale(1.11);} }
.hero__veil{ position:absolute; inset:0; z-index:1; }
.hero--light .hero__veil{
  background:linear-gradient(to bottom,
    rgba(253,248,247,.30) 0%, rgba(253,248,247,0) 22%,
    rgba(247,238,237,.55) 52%, rgba(247,238,237,.93) 72%, var(--paper) 88%);
}
.hero--dark .hero__veil{
  background:linear-gradient(to bottom,
    rgba(18,16,13,.42) 0%, rgba(18,16,13,.10) 34%,

}
.hero__inner{ position:relative; z-index:2; width:100%; max-width:var(--col); text-align:center; }
.hero--light .hero__inner{ text-shadow:0 1px 20px rgba(253,248,247,.92); }
.hero--dark  .hero__inner{ text-shadow:0 1px 26px rgba(12,10,8,.8); }

.hero__eyebrow{
  font-family:var(--serif-en); font-style:italic; font-weight:600;

}
/* Oleo Script 字面偏小、又有下伸筆畫，級數要放大、行高要鬆 */
.hero__names{

}

.hero__names .amp{
  font-family:'Oleo Script', cursive; font-style:normal;
  font-size:.5em; padding:0 .1em;
  color:var(--rouge); opacity:1;
}
.hero__zh{
  font-family:var(--serif-tc); font-weight:700;
  font-size:clamp(.86rem,3.6vw,1rem); letter-spacing:.42em;
  margin:1.5rem 0 0; padding-left:.42em;
}
.hero--light .hero__eyebrow{ color:var(--rouge); }
.hero--light .hero__names{ color:var(--ink); }
.hero--light .hero__zh{ color:var(--ink); opacity:.85; }
.hero--dark .hero__eyebrow{ color:#fff; opacity:.85; }
.hero--dark .hero__names{ color:#fff; }
.hero--dark .hero__zh{ color:var(--paper); opacity:.92; }

/* band：橫幅照片完整呈現，一顆氣球都不切 */
.hero--band{
  flex-direction:column; justify-content:center; align-items:center;
  min-height:0;                    /* 不再撐滿一整屏，照片下方就不會多出空白 */
  padding:7svh 0 2svh; background:var(--paper);
}
.hero--band .hero__cue{ display:none; }        /* band 版面照片就在下方，不需要捲動提示 */
.hero--band + .sec{ padding-top:2.6rem; }      /* 緊接封面的區塊不用再留大片空白 */
.hero--band .hero__bg, .hero--band .hero__veil{ display:none; }
.hero--band .hero__inner{
  padding-inline:var(--gut); text-shadow:none; margin-bottom:1.9rem;
}
.hero--band .hero__eyebrow{ color:var(--rouge); opacity:1; }
.hero--band .hero__names{ color:#6f6a63; }   /* 比主文字色再淺一階的中灰 */
.hero--band .hero__zh{ color:var(--ink-soft); opacity:1; }   /* 與倒數區的引言同色 */
.hero__band{
  position:relative;
  width:100vw; margin-inline:calc(50% - 50vw);
  background-size:cover; background-position:center; background-repeat:no-repeat;
  /* 柔邊做法與下方婚紗照 (.introfig) 完全相同：不用 mask，四邊各 10% 用紙色化開 */
}
/* 左右緣用紙色蓋掉（兩側本來就是純紙底，效果同遮罩但便宜很多）＋暖色薄霧把綠拉回紙調 */
.hero__band::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to right,  var(--paper) 0%, rgba(247,238,237,0) 10%,
                               rgba(247,238,237,0) 90%, var(--paper) 100%),
    linear-gradient(to bottom, var(--paper) 0%, rgba(247,238,237,0) 10%,
                               rgba(247,238,237,0) 90%, var(--paper) 100%);
}

.hero__cue{
  position:absolute; bottom:1.2rem; left:50%; transform:translateX(-50%); z-index:2;
  width:1px; height:2.4rem; animation:cue 2.6s ease-in-out infinite;
  background:linear-gradient(to bottom,transparent,rgba(42,39,36,.5));
}
.hero--dark .hero__cue{ background:linear-gradient(to bottom,transparent,rgba(247,238,237,.7)); }
@keyframes cue{ 0%,100%{opacity:.25;transform:translateX(-50%) scaleY(.6);} 50%{opacity:1;transform:translateX(-50%) scaleY(1);} }

/* ── 倒數 ──────────────────────────────────────────── */
.clock{ display:grid; grid-template-columns:repeat(4,1fr); align-items:end; }

  content:''; position:absolute; left:0; top:.7rem; bottom:1.7rem;

}
.cd__n{

}
/* 中文為主、英文為輔，同一排；級數壓小才塞得進 320px 的四欄 */
.cd__u{ display:flex; align-items:baseline; justify-content:center; gap:.3em; }

}

.quote{

}
.rsvp__sub{ text-align:center; font-size:.9rem; color:var(--ink-soft); margin:-1.4rem 0 2.8rem; }
.rsvp__sub b{ font-weight:600; color:var(--rouge); }

.f{ margin-bottom:1.9rem; }
.f > label, .f > .lg{
  display:block; font-family:var(--sans-tc); font-size:.92rem; font-weight:500;
  letter-spacing:.16em; color:var(--ink-soft); margin-bottom:.7rem;
}
.f .en{ color:var(--ink-faint); font-size:.78rem; letter-spacing:.14em; margin-left:.5em; }
.f .req{ color:var(--rouge); margin-left:.25em; }
.f .hint{ font-size:.8rem; letter-spacing:.06em; color:var(--ink-faint); font-weight:400; }

input[type=text], input[type=tel], select, textarea{
  width:100%; font-family:var(--serif-tc); font-size:1rem; color:var(--ink);
  background:var(--card); border:1px solid var(--wash);
  padding:.8rem .9rem; border-radius:0; -webkit-appearance:none; appearance:none;
  transition:border-color .25s ease;
}
input:focus, select:focus, textarea:focus{ outline:0; border-color:var(--rouge); }
textarea{ resize:vertical; min-height:5rem; line-height:1.9; }
select{
  background-image:
    linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
    linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 1.35rem, calc(100% - 12px) 1.35rem;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:2.4rem;
}
::placeholder{ color:var(--ink-ghost); opacity:1; }

.pick{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.pick input{ position:absolute; opacity:0; width:0; height:0; }
.pick label{
  position:relative; display:flex; align-items:center; justify-content:center;
  text-align:center; min-height:4.4rem; padding:.85rem .8rem; cursor:pointer;
  font-size:.92rem; line-height:1.55; letter-spacing:.06em; color:var(--ink-soft);
  border:1.5px solid var(--wash); background:var(--card);
  transition:background .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease,opacity .22s ease;
}
.pick input:checked + label{
  border-color:var(--rouge); background:var(--rouge); color:var(--paper);
  box-shadow:0 7px 20px -9px rgba(156,79,74,.8);
}
.pick input:checked + label::after{
  content:'✓'; position:absolute; top:.45rem; right:.6rem; font-size:.78rem; opacity:.8;
}
.pick:has(input:checked) input:not(:checked) + label{ opacity:.4; }
.pick input:focus-visible + label{ outline:2px solid var(--rouge); outline-offset:2px; }

.chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
.chips input{ position:absolute; opacity:0; width:0; height:0; }
.chips label{
  cursor:pointer; padding:.5rem 1.05rem; font-size:.88rem; letter-spacing:.06em;
  color:var(--ink-soft); border:1.5px solid var(--wash); border-radius:999px;
  background:var(--card); transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.chips input:checked + label{ border-color:var(--sage-deep); background:var(--sage-deep); color:var(--paper); }
.chips input:focus-visible + label{ outline:2px solid var(--rouge); outline-offset:2px; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:1.3rem; }
#details{ overflow:hidden; max-height:0; opacity:0;
  transition:max-height .55s cubic-bezier(.22,1,.36,1), opacity .4s ease; }
#details.open{ max-height:70rem; opacity:1; }

.err{ font-family:var(--sans-tc); font-size:.78rem; color:var(--rouge);
  margin:0 0 1.2rem; min-height:1.2em; letter-spacing:.06em; }
.send{
  width:100%; font-family:var(--sans-tc); font-size:.88rem; font-weight:500;
  letter-spacing:.28em; color:var(--paper); background:var(--ink);
  border:0; padding:1.2rem; cursor:pointer; transition:background .25s ease;
}
.send:hover{ background:var(--rouge); }
.send[disabled]{ opacity:.45; cursor:progress; }

.done{ display:none; text-align:center; padding:2rem 0; }
.done.show{ display:block; animation:rise .7s cubic-bezier(.22,1,.36,1) both; }
.done__mark{ font-family:var(--serif-en); font-style:italic; font-size:3rem; color:var(--rouge); margin:0 0 1rem; }
.done__t{ font-family:var(--serif-tc); font-size:1.3rem; letter-spacing:.16em; margin:0 0 .8rem; }
.done__s{ font-size:.92rem; color:var(--ink-soft); margin:0; line-height:1.95; }
.redo{
  margin-top:1.6rem; padding:.7rem 1.6rem; cursor:pointer;
  font-family:var(--sans-tc); font-size:.78rem; letter-spacing:.18em;
  color:var(--ink-soft); background:transparent; border:1px solid var(--wash);
  transition:border-color .25s ease, color .25s ease;
}
.redo:hover{ border-color:var(--ink-soft); color:var(--ink); }

/* ── 結尾 ──────────────────────────────────────────── */
.foot{ padding:2.6rem 0 2rem; text-align:center; }
.bottomfig-wrap{ padding:.6rem 0 2.4rem; }
.bottomfig-wrap .introfig{ margin-top:0; }
/* 緊接封面照，中間不另外留空 */
.topfig-wrap .introfig{ margin-top:0; }
/* 頁尾中文署名 */
.foot__names{
  font-family:var(--serif-tc); font-weight:500; font-size:1.7rem;
  line-height:1.4; color:var(--ink); margin:0 0 .6rem;
  letter-spacing:.2em; padding-left:.2em;
}
.foot__d{ font-family:var(--sans-tc); font-size:.66rem; letter-spacing:.3em; color:var(--ink-faint); margin:0; }
.foot__msg{
  font-family:var(--serif-tc); font-size:.94rem; font-weight:500;
  letter-spacing:.14em; color:var(--ink-soft); margin:.7rem 0 0; padding-left:.14em;
}

/* ── 動態 ──────────────────────────────────────────── */
@keyframes rise{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }
.reveal{ opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1); }
.reveal.in{ opacity:1; transform:none; }
.hero__eyebrow,.hero__names,.hero__zh{ animation:rise 1.2s cubic-bezier(.22,1,.36,1) both; }
.hero__eyebrow{ animation-delay:.25s; }
.hero__names{ animation-delay:.45s; }
.hero__zh{ animation-delay:.75s; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
  .reveal{ opacity:1; transform:none; }
}
@media (max-width:380px){
  :root{ --gut:1.35rem; }
  .grid2{ grid-template-columns:1fr; gap:1.6rem; }
  .swatches{ gap:1.1rem; }
  .sw__dot{ width:3.6rem; height:3.6rem; }
}

/* ── 關於我們 ─────────────────────────────────────────── */
/* 三欄 grid：第一列放兩張圓照＋中間愛心，第二列放名字。
   愛心用 align-items:center 對齊照片列，就會剛好落在圓心高度。 */
.about{
  display:grid; grid-template-columns:1fr auto 1fr;
  column-gap:clamp(.5rem, 3.2vw, 1.6rem); row-gap:1.05rem;
  align-items:center; justify-items:center;
  max-width:520px; margin:2.1rem auto 0;
}
/* height:auto 必須寫，否則 <img height="600"> 會壓過 aspect-ratio 變成橢圓 */
.about__img{
  display:block; width:100%; height:auto; aspect-ratio:1;
  object-fit:cover; border-radius:50%;
  box-shadow:0 3px 16px rgba(74,68,61,.10);
}
.about__cap{ text-align:center; }
.about__en{
  display:block; font-family:var(--serif-en); font-weight:600;
  font-size:1.04rem; letter-spacing:.09em; color:var(--rouge);
}
.about__zh{
  display:block; margin-top:.32rem;

/* 愛心對齊圓形照片的中心，不跟著下面的文字掉下去 */
.about__heart{

  padding-top:calc(min(238px, 30vw) / 2 - .7rem);

<script>
/* ═══════════════════════════════════════════════════════════════
   ③ 邏輯 — 以下不用改
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 依標點切句，短句段設成不斷行，折行就會落在標點上而不是把詞拆開。
   超過 NB_MAX 的句段不包，否則窄螢幕會被撐破。 */
const NB_MAX = 9;
function nbClauses(str){
  const parts = esc(str).split(/([，、｜])/);
  const segs = [];
  for (let i = 0; i < parts.length; i += 2) {
    const seg = parts[i] + (parts[i + 1] || '');
    if (seg) segs.push(seg);
  }
  return segs.map(s => [...s].length <= NB_MAX ? `<span class="nb">${s}</span>` : s).join('');
}

/* ── 封面 ─────────────────────────────────────────── */
$('dGroom').textContent     = CONFIG.groom;
$('dBride').textContent     = CONFIG.bride;
$('dTagEn').textContent     = CONFIG.taglineEn || '';
$('dTagZh').textContent     = CONFIG.taglineZh || '';
/* 中文字面比拉丁數字高，縮一階才會等高 */
$('dDateEn').innerHTML = esc(CONFIG.dateEn).replace(/([^\x00-\x7F]+)/g, '<span class="cjk-fit">$1</span>');
/* 逗號分句、句內不斷行，避免在詞中間折行（例：陪／我） */
$('dQuote').innerHTML = (CONFIG.quote || '').split('，')
  .map((s, i, a) => `<span class="nb">${esc(s)}${i < a.length - 1 ? '，' : ''}</span>`).join('');
$('dDeadline').textContent  = CONFIG.rsvpDeadline;
$('dFootNames').textContent = `${CONFIG.groomZh}＆${CONFIG.brideZh}`;
if (!CONFIG.quote) $('dQuote').hidden = true;

/* 關於我們：兩張圓形照中間夾一顆愛心 */
{
  const A  = [CONFIG.about.groom, CONFIG.about.bride];
  const im = p => `<img class="about__img" src="${esc(p.photo)}" width="600" height="600"
                        loading="lazy" decoding="async" alt="${esc(p.zh)}">`;
  const ca = p => `<div class="about__cap">
                     <span class="about__en">${esc(p.en)}</span>
                     <span class="about__zh">${esc(p.zh)}</span>
                   </div>`;
  $('dAbout').innerHTML =
    im(A[0]) + '<p class="about__heart" aria-hidden="true">♥</p>' + im(A[1]) +
    ca(A[0]) + '<span></span>' + ca(A[1]);
}

if (CONFIG.heroPhoto && CONFIG.heroLayout === 'band') {
  const band = $('heroBand');
  band.hidden = false;
  band.style.backgroundImage = `url("${CONFIG.heroPhoto}")`;
  band.style.aspectRatio     = CONFIG.heroRatio || '3 / 2';
  $('hero').classList.add('has-photo', 'hero--band');
} else if (CONFIG.heroPhoto) {
  const bg = $('heroBg');
  bg.style.backgroundImage    = `url("${CONFIG.heroPhoto}")`;
  bg.style.backgroundPosition = CONFIG.heroFocus || 'center';
  bg.style.backgroundRepeat   = 'no-repeat';
  $('hero').classList.add('has-photo', CONFIG.heroText === 'dark' ? 'hero--light' : 'hero--dark');
} else {
  $('hero').classList.add('hero--dark');
}
/* og:image 已寫死在 <head>，爬蟲才讀得到；換封面時記得一併改那行 */

/* ── 資訊卡 ────────────────────────────────────────── */
const cards = [];
if (CONFIG.ceremony) cards.push(CONFIG.ceremony);
if (CONFIG.banquet)  cards.push(CONFIG.banquet);

/* 時間段（拉丁）要放大才跟中文等高；中間的空白留在 span 外，避免連空格一起被放大 */
function heroHTML(str){
  const m = String(str).match(/^([\x20-\x7E]+?)\s*([^\x00-\x7F][\s\S]*)$/);
  if (!m) return esc(str);
  return `<span class="card__hero-en">${esc(m[1])}</span><span class="card__hero-gap"></span>${esc(m[2])}`;
}

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
          + '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

$('dCards').innerHTML = cards.map(c => `
  <article class="card">
    <h3 class="card__zh">꒰ ${esc(c.zh)} ꒱</h3>
    <p class="card__en">${esc(c.en)}</p>
    <p class="card__hero">${heroHTML(c.hero)}</p>
    <div class="card__rule"></div>
    <dl class="card__facts">
      <dt>地點</dt><dd>${esc(c.place)}<span class="card__addr">${esc(c.addr)}</span></dd>
      ${c.hall ? `<dt>廳別</dt><dd>${esc(c.hall)}</dd>` : ''}
      <dt>時間</dt><dd class="is-time">${nbClauses(c.time)}</dd>
    </dl>
    ${CONFIG.mapUrl ? `<a class="mapbtn" href="${esc(CONFIG.mapUrl)}" target="_blank" rel="noopener">${PIN}交通指引　Google Maps</a>` : ''}
    ${c.notes && c.notes.length ? `<dl class="card__notes">
      ${c.notes.map(n => `<dt>${esc(n.k)}</dt><dd>${nbClauses(n.v)}</dd>`).join('')}
    </dl>` : ''}
  </article>`).join('');

/* ── 服裝建議 ─────────────────────────────────────── */
/* 愛心外框：色票很淡，沒有描邊會看不見，所以用 SVG 才能同時有形狀和外框 */
const HEART = 'M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4'
            + 'c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z';
if (CONFIG.dressCode && CONFIG.dressCode.length) {
  $('secDress').hidden = false;
  $('dSwatches').innerHTML = CONFIG.dressCode.map(c => `
    <div class="sw">
      <span class="sw__dot" style="background:${esc(c.hex)}"></span>
      <p class="sw__zh">${esc(c.zh)}</p>
      <p class="sw__en">${esc(c.en)}</p>
    </div>`).join('');
}

/* ── 相簿 ─────────────────────────────────────────── */
if (CONFIG.gallery && CONFIG.gallery.length) {
  $('dGallery').hidden = false;
  $('dGallery').innerHTML = CONFIG.gallery.map((src,i) =>
    `<img src="${esc(src)}" alt="${esc(CONFIG.groom)} & ${esc(CONFIG.bride)} 合照 ${i+1}" loading="lazy">`).join('');
}

/* ── 關係下拉 ─────────────────────────────────────── */
$('fRelation').insertAdjacentHTML('beforeend',
  RELATIONS.map(r => `<option>${esc(r)}</option>`).join(''));

/* ── 倒數 ─────────────────────────────────────────── */
(function countdown(){
  const target = new Date(CONFIG.dateISO);
  const pad = n => String(n).padStart(2,'0');
  const tick = () => {
    const diff = target - new Date();
    if (diff <= 0) {
      $('dClock').innerHTML = '<p class="clock__done">今天就是我們的日子</p>';
      return true;
    }
    const s = Math.floor(diff/1000);
    $('cdD').textContent = Math.floor(s/86400);
    $('cdH').textContent = pad(Math.floor(s%86400/3600));
    $('cdM').textContent = pad(Math.floor(s%3600/60));
    $('cdS').textContent = pad(s%60);
  };
  if (!tick()) { const t = setInterval(() => { if (tick()) clearInterval(t); }, 1000); }
})();

/* ── 出席分流 ─────────────────────────────────────── */
document.querySelectorAll('input[name=attend]').forEach(r =>
  r.addEventListener('change', () => {
    $('details').classList.toggle('open', $('aYes').checked);
    $('errBox').textContent = '';
  }));

/* ── 葷食／素食互斥；「其他」可與兩者並存（例如葷食＋不吃牛）───── */
['d1','d2'].forEach(id => $(id).addEventListener('change', e => {
  if (e.target.checked) ['d1','d2'].filter(o => o !== id).forEach(o => { $(o).checked = false; });
}));
$('d3').addEventListener('change', e => { $('dietOtherBox').hidden = !e.target.checked; });

/* ── 捲動進場 ─────────────────────────────────────── */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold:.1 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

/* ── 送出 ─────────────────────────────────────────── */
$('rsvpForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('errBox');
  const name = $('fName').value.trim();
  const yes = $('aYes').checked, no = $('aNo').checked;

  if (!name)       { err.textContent = '請留下您的名字。'; $('fName').focus(); return; }
  if (!yes && !no) { err.textContent = '請選擇是否出席。'; return; }
  if (yes && !$('fAdults').value) { err.textContent = '請選擇大人人數。'; $('fAdults').focus(); return; }
  err.textContent = '';

  const p = new URLSearchParams();
  p.append(FIELD.name,      name);
  p.append(FIELD.contact,   $('fContact').value.trim());
  p.append(FIELD.relation,  $('fRelation').value);
  p.append(FIELD.attending, yes ? ATTEND_YES : ATTEND_NO);
  p.append(FIELD.message,   $('fMsg').value.trim());

  if (yes) {
    p.append(FIELD.adults, $('fAdults').value);
    if ($('fKidsA').value) p.append(FIELD.kidsSeated, $('fKidsA').value);
    if ($('fKidsB').value) p.append(FIELD.kidsLap,    $('fKidsB').value);

    /* 表單那題開了「其他」，Google 的約定是送 __other_option__ ＋ .other_option_response */
    const dietNote = $('fDietOther').value.trim();
    [...document.querySelectorAll('#dietChips input:checked')].forEach(c => {
      p.append(FIELD.diet, c.value === '其他' ? '__other_option__' : c.value);
    });
    if ($('d3').checked && dietNote) p.append(FIELD.diet + '.other_option_response', dietNote);
  }

  /* 多區段表單必要參數，少了 Google 只會收到第一頁 */
  p.append('fvv', '1');
  p.append('pageHistory', '0,1,2');
  p.append('submit', 'Submit');

  const btn = $('sendBtn');
  btn.disabled = true; btn.textContent = '送出中⋯';

  try {
    await fetch(CONFIG.formAction, {
      method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
      body:p.toString(),
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = '確認送出　SUBMIT';
    err.textContent = '送出失敗，請檢查網路後再試一次。';
    return;
  }

  $('formBox').hidden = true;
  $('doneT').textContent = yes ? '太好了，我們收到了' : '謝謝您的祝福';
  $('doneS').innerHTML = nbClauses(yes
    ? '11 月 7 日中午，我們留了位子等您，那天見 ♡'
    : '這次沒能見到有點可惜，您的心意我們收下了，改天再約 ♡');
  $('doneBox').classList.add('show');
  $('doneBox').scrollIntoView({ behavior:'smooth', block:'center' });
});

/* ── 修改回覆：退回表單，欄位內容保留，改完再送一次 ───────── */
$('redoBtn').addEventListener('click', () => {
  $('doneBox').classList.remove('show');
  $('formBox').hidden = false;
  const btn = $('sendBtn');
  btn.disabled = false; btn.textContent = '確認送出　SUBMIT';
  $('errBox').textContent = '';
  $('rsvpForm').scrollIntoView({ behavior:'smooth', block:'start' });
});

</script>
</body>
</html>
